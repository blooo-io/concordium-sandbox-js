<!DOCTYPE html>
<html>
  <head>
    <title>Parcel Sandbox</title>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="styles.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-ka7Sk0Gln4gmtz2MlQnikT1wXgYsOg+OMhuP+IlRH9sENBO0LRn5q+8nbTov4+1p" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/web3@latest/dist/web3.min.js"></script>
    <script type="module" src="index.js"></script>
  </head>

  <body class="m-5">
    <div class="d-flex flex-column justify-content-center m-5 align-items-center">
      <p>Click on the bellow button to connect your Ledger Wallet</p>
      <button class="btn btn-primary w-25" data-bs-toggle="modal" data-bs-target="#WalletModal">Connect your Wallet</button>
    </div>
    <div class="d-flex flex-row">
      <div id="app" class="w-100">
        <form class="row g-3">
          <div class="col-md-6">
            <button type="button" id="get-address" class="btn btn-primary">Get Address</button>
          </div>
          <div class="col-md-6">
            <label for="wallet-input" class="form-label">Wallet Public Key</label>
            <input type="text" class="form-control" id="wallet-input" disabled>
          </div>
          <div class="col-md-6">
            <button type="button" id="export-private-key" class="btn btn-primary">Export Private Key</button>
          </div>
          <div class="col-md-6">
            <label for="private-key-input" class="form-label">Private Key</label>
            <input type="text" class="form-control" id="private-key-input" disabled>
          </div>
          <div class="col-6">
            <button type="button" id="verify-address" class="btn btn-primary">Verify Address</button>
          </div>
          <div class="col-md-6">
            <label for="verify-address-input" class="form-label">Result Verify Address</label>
            <input type="text" class="form-control" id="verify-address-input" disabled>
          </div>
          <div class="col-6">
            <button type="button" id="verify-address-legacy" class="btn btn-primary">Verify Address Legacy</button>
          </div>
          <div class="col-md-6">
            <label for="verify-address-legacy-input" class="form-label">Result Verify Address Legacy</label>
            <input type="text" class="form-control" id="verify-address-legacy-input" disabled>
          </div>
          <div class="col-md-6">
            <button type="button" id="simple-transfer" class="btn btn-primary">Simple Transfer</button>
          </div>
          <div class="col-md-6">
            <label for="simple-transfer-input" class="form-label">Result Simple Transfer</label>
            <input type="text" class="form-control" id="simple-transfer-input" disabled>
          </div>
          <div class="col-md-6">
            <button type="button" id="simple-transfer-with-memo" class="btn btn-primary">Simple Transfer With Memo</button>
          </div>
          <div class="col-md-6">
            <label for="simple-transfer-with-memo-input" class="form-label">Result Simple Transfer With Memo</label>
            <input type="text" class="form-control" id="simple-transfer-with-memo-input" disabled>
          </div>
          <div class="col-6">
            <button type="button" id="transfer-with-schedule" class="btn btn-primary">Transfer with Schedule</button>
          </div>
          <div class="col-md-6">
            <label for="transfer-with-schedule-input" class="form-label">Result Transfer with Schedule</label>
            <input type="text" class="form-control" id="transfer-with-schedule-input" disabled>
          </div>
          <div class="col-6">
            <button type="button" id="transfer-with-schedule-memo" class="btn btn-primary">Transfer with Schedule and Memo</button>
          </div>
          <div class="col-md-6">
            <label for="transfer-with-schedule-memo-input" class="form-label">Result Transfer with Schedule and Memo</label>
            <input type="text" class="form-control" id="transfer-with-schedule-memo-input" disabled>
          </div>
          <div class="col-6">
            <button type="button" id="transfer-to-public" class="btn btn-primary">Transfer to Public</button>
          </div>
          <div class="col-md-6">
            <label for="transfer-to-public-input" class="form-label">Result Transfer to Public</label>
            <input type="text" class="form-control" id="transfer-to-public-input" disabled>
          </div>
          <div class="col-6">
            <button type="button" id="configure-delegation" class="btn btn-primary">Configure Delegation</button>
          </div>
          <div class="col-md-6">
            <label for="configure-delegation-input" class="form-label">Result Configure Delegation</label>
            <input type="text" class="form-control" id="configure-delegation-input" disabled>
          </div>
          <div class="col-6">
            <button type="button" id="configure-baker" class="btn btn-primary">Configure Baker</button>
          </div>
          <div class="col-md-6">
            <label for="configure-baker-input" class="form-label">Result Configure Baker</label>
            <input type="text" class="form-control" id="configure-baker-input" disabled>
          </div>
          <div class="col-6">
            <button type="button" id="register-data" class="btn btn-primary">Register Data</button>
          </div>
          <div class="col-md-6">
            <label for="register-data-input" class="form-label">Result Register Data</label>
            <input type="text" class="form-control" id="register-data-input" disabled>
          </div>
          <div class="col-6">
            <button type="button" id="update-credential" class="btn btn-primary">Update Credential</button>
          </div>
          <div class="col-md-6">
            <label for="update-credential-input" class="form-label">Result Update Credential</label>
            <input type="text" class="form-control" id="update-credential-input" disabled>
          </div>
          <div class="col-6">
            <button type="button" id="credential-deployment" class="btn btn-primary">Credential Deployment</button>
          </div>
          <div class="col-md-6">
            <label for="credential-deployment-input" class="form-label">Result Credential Deployment</label>
            <input type="text" class="form-control" id="credential-deployment-input" disabled>
          </div>
          <div class="col-6">
            <button type="button" id="deploy-module" class="btn btn-primary">Deploy Module</button>
          </div>
          <div class="col-md-6">
            <label for="deploy-module-input" class="form-label">Result Deploy Module</label>
            <input type="text" class="form-control" id="deploy-module-input" disabled>
          </div>
          <div class="col-6">
            <button type="button" id="init-contract" class="btn btn-primary">Init Contract</button>
          </div>
          <div class="col-md-6">
            <label for="init-contract-input" class="form-label">Result Init Contract</label>
            <input type="text" class="form-control" id="init-contract-input" disabled>
          </div>
          <div class="col-6">
            <button type="button" id="update-contract" class="btn btn-primary">Update Contract</button>
          </div>
          <div class="col-md-6">
            <label for="update-contract-input" class="form-label">Result Update Contract</label>
            <input type="text" class="form-control" id="update-contract-input" disabled>
          </div>
        </form>
      </div>
    </div>

    <!-- Modal -->
    <div class="modal fade" id="WalletModal" tabindex="-1" aria-labelledby="WalletModalLabel" aria-hidden="true">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="WalletModalLabel">Choose your Wallet</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body d-flex justify-content-center">
            <button id="connect-ledger" class="rounded-3 align-self-center" data-bs-dismiss="modal">
              <img src="./assets/ledger-seeklogo.com.svg" class="card-img-top" alt="Ledger">
            </button>
          </div>
        </div>
      </div>
    </div>
    <div id="footer" class="mt-3">
      <p id="version"></p>
    </div>
  </body>
</html>
